{% extends "base.html" %}{% block title %}New book — PageTurn{% endblock %}
{% block content %}<div class="editor-top"><div><span class="eyebrow">NEW PROJECT</span><h1>Create a book</h1><p>Give your idea a title. You can edit everything later.</p></div><a class="text-link" href="{{ url_for('dashboard') }}">← Back to library</a></div><form class="editor-card" method="post"><label>Book title<input name="title" required maxlength="200" placeholder="e.g. The Art of Starting"></label><label>Short description<textarea name="description" rows="2" placeholder="What is this book about?"></textarea></label><label>Start writing<textarea class="writing-area" name="content" rows="14" placeholder="# Chapter 1&#10;&#10;Your story begins here...&#10;&#10;## A new section&#10;Write your paragraphs here."></textarea></label><p class="hint">Tip: use <code># Chapter title</code> and <code>## Section title</code> for headings in your PDF.</p><div class="form-buttons"><a class="btn btn-light" href="{{ url_for('dashboard') }}">Cancel</a><button class="btn" type="submit">Create book →</button></div></form>{% endblock %}
