{% extends "base.html" %}{% block title %}Create account — PageTurn{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-aside"><span class="eyebrow">START CREATING</span><h1>Every great book begins with one page.</h1><p>Set up your free writing space and bring your next idea to life.</p></div><form class="form-card" method="post"><span class="eyebrow">WELCOME ABOARD</span><h2>Create account</h2><label>Your name<input name="name" required maxlength="100" placeholder="Your name"></label><label>Email address<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" minlength="6" required placeholder="At least 6 characters"></label><button class="btn full" type="submit">Create account</button><p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></form></section>{% endblock %}
