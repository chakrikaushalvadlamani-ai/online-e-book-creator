{% extends "base.html" %}{% block title %}Edit {{ book.title }} — PageTurn{% endblock %}
{% block content %}<div class="editor-top"><div><span class="eyebrow">BOOK EDITOR</span><h1>Edit your book</h1><p>Make it yours, one paragraph at a time.</p></div><div class="top-actions"><a class="btn btn-light" href="{{ url_for('preview_book', book_id=book.id) }}">Preview</a><a class="btn btn-light" href="{{ url_for('download_book', book_id=book.id) }}">Download PDF ↓</a></div></div><form class="editor-card" method="post"><label>Book title<input name="title" required maxlength="200" value="{{ book.title }}"></label><label>Short description<textarea name="description" rows="2">{{ book.description }}</textarea></label><label>Book content<textarea class="writing-area" name="content" rows="20" placeholder="# Chapter 1&#10;&#10;Start writing...">{{ book.content }}</textarea></label><p class="hint">Use <code># Heading</code> for chapter titles and <code>## Subheading</code> for sections.</p><div class="form-buttons"><a class="btn btn-light" href="{{ url_for('dashboard') }}">Back to library</a><button class="btn" type="submit">Save changes ✓</button></div></form>{% endblock %}
